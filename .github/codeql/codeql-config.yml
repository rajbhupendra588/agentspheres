name: AgentSphere CodeQL config

# Keep the default query suite. Exclude js/missing-rate-limiting because it
# false-positives on Fastify services that already rate-limit via:
#   1) @fastify/rate-limit (registered in each service entrypoint)
#   2) rate-limiter-flexible RateLimiterMemory onRequest / handler guards
# See packages/common/src/rate-limit.ts and services/{auth,gateway,registry}.
query-filters:
  - exclude:
      id: js/missing-rate-limiting
